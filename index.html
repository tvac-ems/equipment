<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1b2a6b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TVAC Equip">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>TVAC Equipment</title>
<style>
:root{
  --red:#c8102e;--navy:#1b2a6b;--bg:#f3f4f6;--card:#fff;--text:#111827;--text2:#6b7280;--border:#e5e7eb;
  --ok:#15803d;--okbg:#e8f5e9;--warn:#b45309;--warnbg:#fff4e0;--bad:#b91c1c;--badbg:#fdecea;--blue:#1b2a6b;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
button,.item,.tile,.gl,.chip,.who,.scan-btn,.flag,.ck,a{touch-action:manipulation;-webkit-user-select:none;user-select:none}
.btn,.tile,.gl,.chip,.scan-btn,.tabs button,header button{transition:transform .08s ease,opacity .08s ease,filter .08s ease}
.btn:active,.tile:active,.gl:active,.chip:active,.scan-btn:active,.tabs button:active,header button:active{transform:scale(.96);filter:brightness(.92)}
.item:active,.who:active,.flag:active{background:#eef1f5}
.modal{animation:fadein .12s ease}.sheet{animation:slideup .16s ease}
@keyframes fadein{from{opacity:0}to{opacity:1}}@keyframes slideup{from{transform:translateY(24px)}to{transform:none}}
.syncing{animation:sp 0.8s linear infinite;display:inline-block}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
button,input,select,textarea{font:inherit}
.hidden{display:none!important}
header{position:sticky;top:0;z-index:50;background:var(--navy);border-bottom:3px solid var(--red);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 6px rgba(0,0,0,.15)}
header .logo{width:38px;height:38px;border-radius:50%;background:#fff;object-fit:contain}
header h1{font-size:17px;margin:0;flex:1;line-height:1.1}
header h1 small{display:block;font-size:12px;font-weight:500;opacity:.85}
header button{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:8px;padding:7px 10px;font-weight:600;cursor:pointer}
main{max-width:640px;margin:0 auto;padding:14px 14px 100px}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.card h2{font-size:15px;margin:0 0 10px}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:14px;font-weight:700;font-size:16px;cursor:pointer;background:var(--blue);color:#fff}
.btn.red{background:var(--red)}.btn.green{background:var(--ok)}.btn.ghost{background:#eef1f5;color:var(--text)}.btn.sm{padding:9px 12px;font-size:14px;width:auto;display:inline-block}
.btn:disabled{opacity:.5}
.row{display:flex;gap:10px}.row>*{flex:1}
label{display:block;font-size:13px;font-weight:600;color:var(--text2);margin:10px 0 4px}
input,select,textarea{width:100%;padding:12px;border:1.5px solid var(--border);border-radius:10px;background:#fff;color:var(--text);font-size:16px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue)}
textarea{min-height:70px;resize:vertical}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.tile{background:var(--card);border-radius:12px;padding:10px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.06);cursor:pointer;border:2px solid transparent}
.tile.active{border-color:var(--navy)}
.tile .ic{font-size:22px}.tile .n{font-size:20px;font-weight:800}.tile .l{font-size:11px;color:var(--text2);font-weight:600}
.tile .sub{font-size:11px;margin-top:2px}
.glance{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.gl{border-radius:10px;padding:8px 4px;text-align:center;cursor:pointer;border:2px solid transparent}
.gl.active{border-color:var(--navy)}
.gl .n{font-size:22px;font-weight:900;line-height:1.1}.gl .l{font-size:11px;font-weight:700}
.gl.av{background:var(--okbg);color:var(--ok)}.gl.warn{background:var(--warnbg);color:var(--warn)}.gl.as{background:#e6ecfa;color:var(--navy)}.gl.os{background:var(--badbg);color:var(--bad)}.gl.na{background:#eceef1;color:#4b5563}
.who{display:flex;flex-direction:column;gap:2px;font-size:13px;padding:6px 0;border-top:1px solid var(--border);cursor:pointer}.who span{font-size:12px;color:var(--text2)}
.who b{font-weight:700}
.scan-btn{display:flex;align-items:center;gap:12px;background:var(--red);color:#fff;border-radius:14px;padding:16px;margin-bottom:12px;cursor:pointer;border:0;width:100%;text-align:left;font-weight:700;font-size:17px}
.scan-btn span.big{font-size:28px}
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;padding-bottom:2px}
.chip{flex:none;border:1.5px solid var(--border);background:#fff;border-radius:20px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.item{display:flex;align-items:center;gap:10px;padding:11px 4px;border-bottom:1px solid var(--border);cursor:pointer}
.item:last-child{border-bottom:0}
.item.oos{background:var(--badbg);border-left:4px solid var(--bad);border-radius:8px;padding-left:8px;margin:4px 0}
.item.oos .nm{color:var(--bad)}
.oos-banner{background:var(--bad);color:#fff;border-radius:12px;padding:14px;margin-bottom:10px;text-align:center}
.oos-banner .big{font-size:22px;font-weight:900;letter-spacing:.5px}
.oos-banner .why{font-size:14px;margin-top:4px;opacity:.95}
.na-banner{background:#4b5563}.warn-banner{background:#b45309}
.item .ic{font-size:22px;width:30px;text-align:center}
.item .mid{flex:1;min-width:0}.item .nm{font-weight:700}.item .sub{font-size:12px;color:var(--text2);overflow-wrap:anywhere}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:12px;white-space:nowrap}
.b-in{background:var(--okbg);color:var(--ok)}.b-out{background:var(--badbg);color:var(--bad)}.b-asg{background:#e6ecfa;color:var(--navy)}.b-na{background:#eceef1;color:#4b5563}.b-veh{background:#ede9fe;color:#6d28d9}.gl.veh{background:#ede9fe;color:#6d28d9}
.b-warn{background:var(--warnbg);color:var(--warn)}.b-bad{background:var(--badbg);color:var(--bad)}.b-ok{background:var(--okbg);color:var(--ok)}
.flag{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border-radius:10px;margin-bottom:6px;font-size:13px;font-weight:600}
.flag.warn{background:var(--warnbg);color:var(--warn)}.flag.bad{background:var(--badbg);color:var(--bad)}
.dot{width:9px;height:9px;border-radius:50%;flex:none}.dot.warn{background:#f59e0b}.dot.bad{background:#dc2626}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}.kv div:nth-child(odd){color:var(--text2);font-weight:600}
.checks .ck{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--border);font-weight:600}
.checks .ck input{width:24px;height:24px;flex:none;accent-color:var(--ok)}
.hint{font-size:12px;color:var(--text2);margin-top:4px}
.log{font-size:13px;border-left:3px solid var(--border);padding:4px 0 8px 10px;margin-left:4px}
.log b{font-weight:700}.log .t{color:var(--text2);font-size:12px}
.tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--border);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:40}
.tabs button{flex:1;border:0;background:none;padding:10px 0 8px;font-size:11px;font-weight:600;color:var(--text2);cursor:pointer}
.tabs button .i{display:block;font-size:20px}
.tab-count{position:absolute;top:4px;left:calc(50% + 6px);background:var(--bad);color:#fff;font-size:10px;font-weight:800;border-radius:9px;padding:1px 5px;min-width:16px}
.al-sec{margin-bottom:12px}.al-sec h2{display:flex;align-items:center;gap:6px}.al-sec .why{font-size:12px;font-weight:600;margin-top:1px}.tabs button.on{color:var(--navy)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:640px;max-height:92vh;overflow-y:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.sheet h3{margin:0 0 6px;font-size:18px}
.sheet.tall{height:92vh}
details.sec>summary{list-style:none;display:flex;align-items:center;gap:8px;cursor:pointer}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary h2{margin:0;flex:1}
details.sec>summary:after{content:'›';font-size:22px;color:var(--text2);transition:transform .15s}
details.sec[open]>summary:after{transform:rotate(90deg)}
details.sec[open]>summary{margin-bottom:10px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#111;color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;z-index:200;max-width:90vw;text-align:center}
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--navy)}
#login .card{width:100%;max-width:360px;text-align:center;padding:26px 20px}
#login .logo{width:110px;height:110px;object-fit:contain;display:block;margin:0 auto 12px}
#pin{text-align:center;font-size:26px;letter-spacing:8px}
#scanner{position:fixed;inset:0;background:#000;z-index:150;display:flex;flex-direction:column}
#scanner video{flex:1;width:100%;object-fit:cover}
#scanner .frame{position:absolute;top:50%;left:50%;width:240px;height:240px;transform:translate(-50%,-60%);border:3px solid #fff;border-radius:18px;box-shadow:0 0 0 9999px rgba(0,0,0,.35)}
#scanner .bar{padding:16px 16px calc(16px + env(safe-area-inset-bottom));background:#000}
.spinner{width:28px;height:28px;border:3px solid #ddd;border-top-color:var(--navy);border-radius:50%;animation:sp 0.8s linear infinite;margin:30px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.o2calc{background:#eef4fb;color:var(--blue);border-radius:10px;padding:8px 10px;font-size:13px;font-weight:600;margin-top:6px}
/* FR bag kinds */
.kind{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;color:var(--text2);background:#f1f3f6;border-radius:8px;padding:1px 7px;margin-left:4px;vertical-align:middle;white-space:nowrap}
.kd{width:10px;height:10px;border-radius:50%;display:inline-block;border:1px solid rgba(0,0,0,.18);flex:none}
/* print stickers */
#print-area{display:none}
@media print{
  body > *:not(#print-area){display:none!important}
  @page{size:3in 1in;margin:0}
  html,body{margin:0!important;padding:0!important;background:#fff!important}
  #print-area{display:block!important;position:static}
  .stk{width:3in;height:1in;box-sizing:border-box;padding:.05in .08in;display:flex;align-items:center;gap:.08in;overflow:hidden;page-break-after:always;break-after:page;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .stk:last-child{page-break-after:auto;break-after:auto}
  .stk .qr{width:.9in;height:.9in;flex:none}
  .stk .tx{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:.02in;font-family:Helvetica,Arial,sans-serif}
  .stk .h{display:flex;align-items:center;gap:.04in;font-weight:800;font-size:7.5pt;color:#1b2a6b;border-bottom:1.5pt solid #c8102e;padding-bottom:.02in}
  .stk .h img{width:.2in;height:.2in}
  .stk .n{font-weight:800;font-size:11pt;line-height:1.05;color:#000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .stk .id{font-size:10pt;font-weight:800;color:#c8102e}
  .stk .f{font-size:5.5pt;color:#333}
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login" class="hidden">
  <div class="card">
    <img class="logo" src="logo.png" alt="TVAC">
    <div style="font-size:20px;font-weight:800">TVAC Equipment</div>
    <div style="font-size:12px;color:var(--text2)">Teaneck Volunteer Ambulance Corps</div>
    <div id="login-sub" style="color:var(--text2);font-size:14px;margin:4px 0 16px">Enter your PIN</div>
    <input id="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="••••">
    <div id="login-err" style="color:var(--bad);font-size:13px;height:20px;margin:6px 0"></div>
    <button class="btn red" onclick="doLogin()">Enter</button>
  </div>
</div>

<!-- APP -->
<div id="app" class="hidden">
  <header>
    <img class="logo" src="logo.png" alt="">
    <h1>TVAC Equipment<small id="who"></small></h1>
    <button onclick="refresh()" id="sync">⟳</button>
    <button onclick="accountMenu()" title="My account" style="font-size:13px">👤 Me</button>
  </header>
  <main id="view"></main>
  <nav class="tabs">
    <button data-tab="home" onclick="go('home')"><span class="i">🏠</span>Home</button>
    <button onclick="openScanner()"><span class="i">📷</span>Scan</button>
    <button data-tab="alerts" onclick="go('alerts')" style="position:relative"><span class="i">⚠️</span>Alerts<span id="alert-count" class="tab-count hidden"></span></button>
    <button data-tab="activity" onclick="go('activity')"><span class="i">🕘</span>Activity</button>
    <button data-tab="admin" id="tab-admin" onclick="go('admin')"><span class="i">⚙️</span>Admin</button>
  </nav>
</div>

<div id="modal-root"></div>
<div id="print-area"></div>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
// ════════ CONFIG ════════
// Paste the Apps Script web-app /exec URL here (update when redeploying under the TVAC account).
var APP_VERSION = '2026-09-30.3'; // bump on every release — open apps reload themselves when this changes
var API_URL = 'https://script.google.com/macros/s/AKfycbxEZyMAzgTEBhZhQ7bpifXX3P3sojxhjsn69vTFJPMBI4rsmAjxpTInBUMIAe7WB02W/exec';
// URL encoded into QR stickers (this page). Auto-detected; override if hosting elsewhere.
// Single home base for all equipment (items return here on Check IN).
var HOME_LOCATION = 'TVAC Building';
var APP_URL = location.origin + location.pathname.replace(/index\.html$/, '');

var TYPE_META = {
  'First Responder Bag': { icon: '🎒', short: 'FR Bags', checks: ['Seal intact', 'BP cuff & stethoscope', 'Airway adjuncts (OPA/NPA)', 'BVM (adult & peds)', 'Bleeding control / tourniquet', 'Gloves & PPE', 'Glucometer & supplies', 'Pulse oximeter'] },
  'Oxygen Tank':         { icon: '🫁', short: 'O2 Tanks', checks: ['Regulator attached & working', 'No leaks', 'O-ring / washer present', 'Cylinder undamaged', 'Stored / secured properly'] },
  'AED':                 { icon: '⚡', short: 'AEDs',    checks: ['Status indicator OK', 'Adult pads present & sealed', 'Peds pads present', 'Razor, scissors, towel', 'Unit & case undamaged'] }
};
// FR bag kinds (color / purpose) — managed in Admin, stored in the "Bag Kinds" sheet tab
var KIND_COLORS = { Blue: '#1e5bd8', Green: '#16a34a', Red: '#dc2626', Orange: '#f97316', Yellow: '#eab308', Purple: '#9333ea', Pink: '#ec4899', Black: '#111827', Gray: '#6b7280', White: '#f3f4f6', Brown: '#92400e' };
function kinds() { return (S.cfg && S.cfg.bagKinds) || []; }
function kindOf(i) { if (!i || !i.bagKind) return null; return kinds().filter(function (k) { return k.name === i.bagKind; })[0] || { name: i.bagKind, color: '', checklist: [] }; }
function kindHex(k) { var c = String((k && k.color) || '').trim(); if (/^#/.test(c)) return c; for (var n in KIND_COLORS) if (n.toLowerCase() === c.toLowerCase()) return KIND_COLORS[n]; return '#9ca3af'; }
function kindTag(i) { var k = kindOf(i); return k ? '<span class="kind"><span class="kd" style="background:' + kindHex(k) + '"></span>' + esc(k.name) + '</span>' : ''; }
function bagSvg(hex) { // backpack icon in the bag's own color
  var light = /^#(f|e)/i.test(hex) || /eab308/i.test(hex), cross = light ? '#b91c1c' : '#fff';
  return '<svg viewBox="1.5 0.5 21 23" width="1.2em" height="1.3em" style="vertical-align:-0.3em;display:inline-block" aria-hidden="true">' +
    '<path d="M9 5.5V4.5a3 3 0 0 1 6 0v1" fill="none" stroke="#374151" stroke-width="1.7"/>' +
    '<rect x="3.5" y="5.5" width="17" height="17" rx="4.5" fill="' + hex + '" stroke="rgba(0,0,0,.4)" stroke-width="1"/>' +
    '<rect x="6.5" y="13.5" width="11" height="6.5" rx="2" fill="rgba(255,255,255,.25)" stroke="rgba(0,0,0,.28)" stroke-width=".8"/>' +
    '<path d="M12 7.6v4.2M9.9 9.7h4.2" stroke="' + cross + '" stroke-width="1.6" stroke-linecap="round"/></svg>';
}
function itemIcon(i) { var k = i && i.type === 'First Responder Bag' && kindOf(i); return k ? bagSvg(kindHex(k)) : TYPE_META[i.type].icon; }
function kindChecks(i) { var k = kindOf(i); return k && k.checklist && k.checklist.length ? k.checklist : TYPE_META[i.type].checks; }
var TYPES = Object.keys(TYPE_META);
var O2_FACTORS = { 'D': 0.16, 'Jumbo D': 0.2, 'E': 0.28, 'M': 1.56, 'G': 2.41, 'H/K': 3.14 };
var CONDITIONS = ['OK', 'Needs Attention', 'Out of Service'];
function condLabel(c) { return c === 'Out of Service' ? 'Unavailable (at station)' : c; }
var STATUS_META = {
  'Available':      { cls: 'b-in',  short: 'Available',  icon: '✅' },
  'Assigned':       { cls: 'b-asg', short: 'Signed out', icon: '👤' },
  'Out of Service': { cls: 'b-warn', short: 'Needs attention', icon: '⚠' },
  'On Vehicle':     { cls: 'b-veh', short: 'On vehicle', icon: '🚑' },
  'Not Available':  { cls: 'b-na',  short: 'Not Avail.', icon: '❓' }
};
var STATUSES = Object.keys(STATUS_META);
function isNA(i) { return i.status !== 'Assigned' && i.status !== 'Not Available' && i.status !== 'On Vehicle' && (i.status === 'Out of Service' || (i.condition && i.condition !== 'OK')); }
function effStatus(i) { return isNA(i) ? 'Out of Service' : i.status; }
function flagText(t) { return String(t).replace(/^(Unavailable|Out of Service)/, 'Needs attention'); }
function statusBadge(i) { var m = STATUS_META[effStatus(i)] || STATUS_META['Available']; return '<span class="badge ' + m.cls + '">' + m.short + '</span>'; }
function vehicles() { return (S.cfg && S.cfg.vehicles) || []; }
function whereText(i) { return i.status === 'Assigned' ? '👤 ' + (i.location || '—') : i.status === 'On Vehicle' ? '🚑 ' + (i.location || '—') : i.status === 'Not Available' ? '❓ Not in location' : '📍 ' + (i.location || i.homeLocation || '—'); }

// ════════ STATE ════════
var S = { pin: null, member: null, items: [], cfg: {}, filter: 'All', q: '', tab: 'home', pendingId: null };
function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { return null; } }

// ════════ API ════════
function apiGet(params) {
  var u = API_URL + '?' + Object.keys(params).map(function (k) { return k + '=' + encodeURIComponent(params[k]); }).join('&');
  return fetch(u, { redirect: 'follow', credentials: 'omit' }).then(function (r) { return r.json(); }).then(chk);
}
function apiPost(body) {
  body.pin = S.pin;
  return fetch(API_URL, { method: 'POST', redirect: 'follow', credentials: 'omit', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) })
    .then(function (r) { return r.json(); }).then(chk);
}
function chk(d) {
  if (!d || !d.ok) {
    var msg = (d && d.error) || 'Request failed';
    if (/Not authorized/.test(msg)) logout();
    throw new Error(msg);
  }
  return d;
}

// ════════ UTIL ════════
function $(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function toast(msg, ms) { var t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(function () { t.remove(); }, ms || 2500); }
function ago(ts) {
  if (!ts) return '—';
  var d = new Date(ts), s = (Date.now() - d) / 1000;
  if (s < 60) return 'just now'; if (s < 3600) return Math.floor(s / 60) + 'm ago'; if (s < 86400) return Math.floor(s / 3600) + 'h ago';
  if (s < 86400 * 7) return Math.floor(s / 86400) + 'd ago';
  return d.toLocaleDateString();
}
function fmtTs(ts) { if (!ts) return '—'; var d = new Date(ts); return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) + ' ' + d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' }); }
function worst(flags) { if (!flags || !flags.length) return null; return flags.some(function (f) { return f.level === 'bad'; }) ? 'bad' : 'warn'; }
function isAdmin() { return S.member && S.member.role === 'admin'; }
function getItem(id) { var k = String(id).trim().toUpperCase(); return S.items.find(function (i) { return i.id.toUpperCase() === k; }) || S.items.find(function (i) { return i.oldId && i.oldId.toUpperCase() === k; }); }
function o2Minutes(psi, size, lpm) { var f = O2_FACTORS[size]; if (!f || !psi) return null; return Math.max(0, Math.floor((psi - 200) * f / (lpm || 15))); }
function locations() {
  var set = {};
  S.items.forEach(function (i) { if (i.homeLocation) set[i.homeLocation] = 1; if (i.location) set[i.location] = 1; });
  return Object.keys(set).sort();
}

// ════════ AUTH ════════
function doLogin() {
  var p = $('pin').value.trim(); if (!p) return;
  $('login-err').textContent = '';
  apiGet({ action: 'login', pin: p }).then(function (d) {
    S.pin = p; S.member = d.member; store('tvac_pin', p); store('tvac_member', JSON.stringify(d.member));
    startApp();
  }).catch(function (e) { $('login-err').textContent = '✕ ' + e.message; $('pin').value = ''; $('pin').focus(); });
}
function accountMenu() {
  showModal('<h3>👤 ' + esc(S.member.name) + '</h3><div class="hint" style="margin-bottom:12px">Member #' + esc(S.member.id) + (isAdmin() ? ' · admin' : '') + '</div>' +
    '<button class="btn ghost" style="margin-bottom:8px" onclick="pinForm()">🔑 Change my PIN</button>' +
    '<button class="btn red" style="margin-bottom:8px" onclick="confirmLogout()">Log out</button>' +
    '<button class="btn ghost" onclick="closeModal()">Close</button>');
}
function pinForm() {
  showModal('<h3>🔑 Change my PIN</h3><label>New PIN (4–8 digits)</label><input id="np1" type="password" inputmode="numeric" autocomplete="off">' +
    '<label>Type it again</label><input id="np2" type="password" inputmode="numeric" autocomplete="off">' +
    '<div class="hint" style="margin-top:6px">Use the new PIN next time you log in on any phone. Admins can see it if you forget.</div>' +
    '<div class="row" style="margin-top:14px"><button class="btn ghost" onclick="accountMenu()">Back</button><button class="btn" id="f-go" onclick="savePin()">Save PIN</button></div>');
  setTimeout(function () { if ($('np1')) $('np1').focus(); }, 50);
}
function savePin() {
  var a = $('np1').value.trim(), b = $('np2').value.trim();
  if (!/^\d{4,8}$/.test(a)) { toast('PIN must be 4–8 digits'); return; }
  if (a !== b) { toast('The two PINs don\'t match'); return; }
  busy(true);
  apiPost({ action: 'changePin', newPin: a }).then(function () { S.pin = a; store('tvac_pin', a); S.memberList = null; closeModal(); toast('✓ PIN changed'); })
    .catch(function (e) { busy(false); toast('⚠ ' + e.message, 4000); });
}
function confirmLogout() {
  showModal('<h3>Log out?</h3><div class="hint" style="margin-bottom:14px">Logged in as ' + esc(S.member.name) + ' (#' + esc(S.member.id) + '). You\'ll need your PIN to log back in.</div>' +
    '<div class="row"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn red" onclick="closeModal();logout()">Log out</button></div>');
}
function logout() {
  store('tvac_pin', null); store('tvac_member', null); store('tvac_cache', null); store('tvac_hist', null); S.logs = null; S.pin = null; S.member = null;
  $('app').classList.add('hidden'); $('login').classList.remove('hidden'); $('pin').value = '';
}
function startApp() {
  $('login').classList.add('hidden'); $('app').classList.remove('hidden');
  $('who').textContent = S.member.name + ' · #' + S.member.id;
  $('tab-admin').classList.toggle('hidden', !isAdmin());
  // show last-known data instantly, then refresh from the server
  try { var c = JSON.parse(store('tvac_cache') || 'null'); if (c && c.items) { S.items = c.items; S.cfg = c.cfg || {}; S.loaded = true; } } catch (e) {}
  if (S.tab !== 'home' && S.tab !== 'activity' && S.tab !== 'alerts' && !(S.tab === 'admin' && isAdmin())) S.tab = 'home';
  render();
  if (S.pendingId && getItem(S.pendingId)) { var pid = S.pendingId; S.pendingId = null; S.scanId = pid; openItem(pid); }
  refresh().then(function () {
    if (S.pendingId) { var id = S.pendingId; S.pendingId = null; S.scanId = id; openItem(id); }
  });
}
function quickFlags(i) { // instant local flags until the server's version arrives
  var why = i.statusNote ? ': ' + i.statusNote : '';
  i.flags = (i.flags || []).filter(function (f) { return !/^(Out of Service|Unavailable|Needs Attention|Not Available)/i.test(f.text); });
  if (i.status === 'Out of Service') i.flags.unshift({ level: 'warn', text: 'Needs attention' + why });
  else if (i.condition === 'Needs Attention') i.flags.unshift({ level: 'warn', text: 'Needs Attention' + why });
  if (i.status === 'Not Available') i.flags.unshift({ level: 'bad', text: 'Not Available / missing' });
}
function saveCache() { try { store('tvac_cache', JSON.stringify({ items: S.items, cfg: S.cfg })); } catch (e) {} }

// ════════ DATA ════════
function refresh() {
  if (S.refreshing) return S.refreshing;
  $('sync').innerHTML = '<span class="syncing">⟳</span>';
  S.refreshing = apiGet({ action: 'getInventory', pin: S.pin }).then(function (d) {
    S.items = d.items; S.cfg = d.config || {}; S.loaded = true; saveCache(); checkNewAlerts();
    $('sync').textContent = '⟳'; S.refreshing = null;
    if (!$('modal-root').innerHTML) render(); else if (S.tab === 'home') renderList();
  }).catch(function (e) { $('sync').textContent = '⟳'; S.refreshing = null; toast('⚠ ' + e.message); S.loaded = true; if (!$('modal-root').innerHTML) render(); });
  return S.refreshing;
}

// ════════ ROUTER ════════
function go(tab) { S.tab = tab; history.replaceState(null, '', APP_URL + (tab === 'home' ? '' : '?tab=' + tab)); render(); window.scrollTo(0, 0); }
function render() {
  document.querySelectorAll('.tabs button[data-tab]').forEach(function (b) { b.classList.toggle('on', b.dataset.tab === S.tab); });
  if (S.tab === 'home') renderHome();
  else if (S.tab === 'activity') renderActivity();
  else if (S.tab === 'alerts') renderAlerts();
  else if (S.tab === 'admin') renderAdmin();
  updateAlertCount();
}

// ════════ HOME ════════
function renderHome() {
  var active = S.items.filter(function (i) { return i.active; });
  var tiles = TYPES.map(function (t) {
    var list = active.filter(function (i) { return i.type === t; });
    var cnt = function (st) { return list.filter(function (i) { return i.status === st; }).length; };

      '<div class="ic">' + TYPE_META[t].icon + '</div><div class="n">' + list.length + '</div><div class="l">' + TYPE_META[t].short + '</div>' +
      '<div class="sub"><span style="color:var(--ok)">' + av + ' avail</span>' + (asg ? ' · <span style="color:var(--navy)">' + asg + ' asg</span>' : '') +
      (oos ? ' · <span style="color:var(--warn)">' + oos + ' ⚠</span>' : '') + '</div></div>';
  }).join('');

  var flagged = active.filter(function (i) { return i.flags.length; })
    .sort(function (a, b) { return (worst(b.flags) === 'bad') - (worst(a.flags) === 'bad'); });
  var alerts = flagged.length ? '<div class="card"><h2>⚠ Needs attention (' + flagged.length + ')</h2>' +

      return '<div class="flag ' + worst(i.flags) + '" style="cursor:pointer" onclick="openItem(\'' + esc(i.id) + '\')"><span>' + itemIcon(i) + '</span><span><b>' + esc(i.name) + '</b> — ' + i.flags.map(function (f) { return esc(flagText(f.text)); }).join(' · ') + '</span></div>';
    }).join('') + '<div class="hint" style="cursor:pointer;font-weight:700;color:var(--navy);margin-top:4px" onclick="go(\'alerts\')">' + (flagged.length > 6 ? '+ ' + (flagged.length - 6) + ' more — ' : '') + 'View all alerts →</div>' + '</div>' : '';

  var chips = ['All', 'Mine'].concat(STATUSES.filter(function (x) { return x !== 'Not Available'; }), ['Flagged'], TYPES).map(function (c) {
    var lbl = TYPE_META[c] ? TYPE_META[c].short : c === 'Mine' ? 'My items' : STATUS_META[c] ? STATUS_META[c].short : c;
    return '<button class="chip' + (S.filter === c ? ' on' : '') + '" onclick="setFilter(\'' + c + '\')">' + lbl + '</button>';
  }).join('') + kinds().map(function (k, n) {
    var cnt = active.filter(function (i) { return i.bagKind === k.name; }), av = cnt.filter(function (i) { return i.status === 'Available'; }).length;
    return cnt.length ? '<button class="chip' + (S.filter === 'kind:' + n ? ' on' : '') + '" onclick="setFilter(\'kind:' + n + '\')"><span style="margin-right:3px">' + bagSvg(kindHex(k)) + '</span>' + esc(k.name) + ' <span style="opacity:.7">' + av + '/' + cnt.length + '</span></button>' : '';
  }).join('');

  $('view').innerHTML =
    '<button class="scan-btn" onclick="openScanner()"><span class="big">📷</span><span>Scan QR code<br><span style="font-size:13px;font-weight:500;opacity:.9">Sign out or sign in</span></span></button>' +
    glanceHtml(active) + '<div class="tiles">' + tiles + '</div>' + alerts +
    '<div class="card"><input id="q" placeholder="🔍  Search name, ID, location…" value="' + esc(S.q) + '" oninput="S.q=this.value;renderList()" style="margin-bottom:10px">' +
    '<div class="chips">' + chips + '</div><div id="list"></div></div>';
  renderList();
}
function glanceHtml(active) {
  var c = function (st) { return active.filter(function (i) { return st === 'Out of Service' ? isNA(i) || i.status === 'Not Available' : effStatus(i) === st; }).length; };
  var box = function (st, cls, lbl) { return '<div class="gl ' + cls + (S.filter === st ? ' active' : '') + '" onclick="setFilter(\'' + st + '\')"><div class="n">' + c(st) + '</div><div class="l">' + lbl + '</div></div>'; };
  var asg = active.filter(function (i) { return i.status === 'Assigned'; });
  var by = {};
  asg.forEach(function (i) { (by[i.location] = by[i.location] || []).push(i); });
  var who = Object.keys(by).sort().map(function (k) {
    return '<div class="who" onclick="setFilter(\'Assigned\')"><b>👤 ' + esc(k) + '</b>' + by[k].map(function (i) { return '<span>' + itemIcon(i) + ' ' + esc(i.name) + ' — out since ' + fmtTs(i.lastUpdated) + '</span>'; }).join('') + '</div>';
  }).join('');
  var vby = {};
  active.filter(function (i) { return i.status === 'On Vehicle'; }).forEach(function (i) { (vby[i.location] = vby[i.location] || []).push(i); });
  var veh = vehicles().concat(Object.keys(vby).filter(function (k) { return vehicles().indexOf(k) < 0; })).filter(function (k) { return vby[k]; }).map(function (k) {
    return '<div class="who" onclick="setFilter(\'On Vehicle\')"><b>🚑 ' + esc(k) + ' <span class="hint">(' + vby[k].length + ')</span></b>' + vby[k].map(function (i) { return '<span>' + itemIcon(i) + ' ' + esc(i.name) + ' <span class="hint">#' + esc(i.id) + '</span></span>'; }).join('') + '</div>';

  return '<div class="card"><h2 style="margin-bottom:0">At a glance <span class="hint" style="font-weight:500">· ' + active.length + ' items</span></h2>' +
    '<div class="glance" style="grid-template-columns:repeat(4,1fr)">' + box('Available', 'av', 'Available') + box('Assigned', 'as', 'Signed out') + box('On Vehicle', 'veh', '🚑 On vehicle') + box('Out of Service', 'warn', '⚠ Needs attention') + '</div>' +
    (function () {
      var g = {}; alertGroups().forEach(function (x) { g[x.key] = x.items.length; });
      var ab = function (n, cls, lbl) { return '<div class="gl ' + cls + '" onclick="go(\'alerts\')"><div class="n">' + n + '</div><div class="l">' + lbl + '</div></div>'; };
      return '<div class="glance" style="grid-template-columns:repeat(2,1fr)">' + ab(g.exp || 0, 'os', '🔴 Expired') + ab(g.soon || 0, 'warn', '🟠 Expiring soon') + '</div>';
    })() +
    (who ? '<div style="margin-top:10px"><div class="hint" style="font-weight:700;margin-bottom:2px">Who has what</div>' + who + '</div>' : '') +
    (veh ? '<div style="margin-top:10px"><div class="hint" style="font-weight:700;margin-bottom:2px">On vehicles</div>' + veh + '</div>' : '') + '</div>';

function setFilter(f) { S.filter = S.filter === f ? 'All' : f; renderHome(); }
function renderList() {
  var q = S.q.toLowerCase().trim();

    if (!i.active) return false;

    if (S.filter === 'Mine' && !(i.status === 'Assigned' && String(i.lastMember) === String(S.member.id))) return false;
    if (S.filter === 'Flagged' && !i.flags.length) return false;
    if (TYPE_META[S.filter] && i.type !== S.filter) return false;
    if (/^kind:/.test(S.filter)) { var fk = kinds()[Number(S.filter.slice(5))]; if (!fk || i.bagKind !== fk.name) return false; }
    if (q && (i.name + ' ' + i.id + ' ' + (i.bagKind || '') + ' ' + i.location + ' ' + i.homeLocation + ' ' + i.serial).toLowerCase().indexOf(q) < 0) return false;
    return true;
  }).sort(function (a, b) { return a.type.localeCompare(b.type) || a.id.localeCompare(b.id, undefined, { numeric: true }); });
  if (!S.loaded && !S.items.length) { $('list').innerHTML = '<div class="spinner"></div><div class="hint" style="text-align:center">Loading equipment…</div>'; return; }
  $('list').innerHTML = list.length ? list.map(itemRow).join('') : '<div class="hint" style="text-align:center;padding:20px">' + (S.items.length ? 'No matching items' : 'No equipment yet' + (isAdmin() ? ' — add items in Admin' : '')) + '</div>';

  var extra = '';

    '<div class="sub">' + esc(i.id) + ' · ' + esc(whereText(i)) + (i.status === 'Assigned' && i.lastUpdated ? ' · 🕒 out since ' + fmtTs(i.lastUpdated) : '') + extra + '</div></div>' +
    statusBadge(i) + '</div>';

// ════════ ITEM DETAIL ════════
function openItem(id) {
  var local = getItem(id), token = S.openTok = (S.openTok || 0) + 1;
  // show what we already have instantly; fetch fresh status + history in the background
  // fixed-height sheet + cached history = nothing jumps when fresh data lands
  if (!S.logs) { try { S.logs = JSON.parse(localStorage.getItem('tvac_hist') || '{}'); } catch (e) { S.logs = {}; } }
  var shown = local ? JSON.stringify(local) : '';
  showModal(local ? itemHtml(local, S.logs[id] || 'loading') : '<div class="spinner"></div>');
  apiGet({ action: 'getItem', id: id, pin: S.pin }).then(function (d) {
    var idx = S.items.findIndex(function (i) { return i.id === d.item.id; });
    if (idx >= 0) S.items[idx] = d.item; else S.items.push(d.item);
    S.logs[id] = (d.log || []).slice(0, 15);
    try { localStorage.setItem('tvac_hist', JSON.stringify(S.logs)); } catch (e) {}
    if (S.openTok !== token || !$('modal-root').innerHTML || $('f-go')) return;
    var sh = document.querySelector('#modal-root .sheet');
    if (JSON.stringify(d.item) !== shown || !$('hist')) { var y = sh.scrollTop; sh.innerHTML = itemHtml(d.item, d.log); sh.scrollTop = y; }
    else $('hist').innerHTML = histHtml(d.log);
  }).catch(function (e) {
    if (S.openTok !== token) return;
    if (local) { if ($('hist') && !S.logs[id]) $('hist').innerHTML = histHtml(null); } else { closeModal(); toast('⚠ ' + e.message); }
  });
}
function histHtml(log) { return log === 'loading' ? '<div class="hint">Loading history…</div>' : log ? (log.length ? log.map(logRow).join('') : '<div class="hint">No history yet</div>') : '<div class="hint">History unavailable right now</div>'; }
function itemHtml(i, log) {
  var m = TYPE_META[i.type], out = i.status === 'Assigned', onv = i.status === 'On Vehicle';
  var kv = [['ID', esc(i.id) + (i.oldId ? ' <span class="hint">(was ' + esc(i.oldId) + ')</span>' : '')], ['Status', statusBadge(i)],
    [out ? 'Assigned to' : onv ? 'Vehicle' : 'Location', esc(out ? i.location : onv ? '🚑 ' + i.location : i.status === 'Not Available' ? 'Not in location' : (i.location || i.homeLocation || '—'))]].concat((out || onv) && i.lastUpdated ? [[out ? 'Out since' : 'On since', fmtTs(i.lastUpdated) + ' <span class="hint">(' + ago(i.lastUpdated) + ')</span>']] : []).concat([['Home', esc(i.homeLocation || '—')]]);
  if (i.type === 'First Responder Bag') kv.push(['Bag kind', kindTag(i) || '<span class="hint">Not set</span>']);
  if (i.type === 'AED') kv.push(['Serial', esc(i.serial || '—')], ['Adult pads exp', esc(i.padsExp || '—')], ['Peds pads exp', esc(i.pedsPadsExp || '—')], ['Battery exp', esc(i.batteryExp || '—')]);
  kv.push(['Last activity', ago(i.lastUpdated) + (i.lastMember ? ' · #' + esc(i.lastMember) : '')]);
  if (i.notes) kv.push(['Permanent notes', esc(i.notes)]);

  var banner = isNA(i) ? '<div class="oos-banner warn-banner"><div class="big">⚠ NEEDS ATTENTION — ' + (i.location && i.location !== i.homeLocation && vehicles().indexOf(i.location) >= 0 ? 'ON ' + esc(i.location).toUpperCase() : 'AT STATION') + '</div><div class="why">Do not take' + (i.statusNote ? ' — ' + esc(i.statusNote) : '') + '</div></div>'
    : i.status === 'Not Available' ? '<div class="oos-banner na-banner"><div class="big">❓ NOT IN LOCATION</div>' + (i.statusNote ? '<div class="why">' + esc(i.statusNote) + '</div>' : '') + '</div>' : '';
  var flags = i.flags.filter(function (f) { return !/^(Out of Service|Unavailable|Needs Attention|Not Available)/i.test(f.text); })
    .map(function (f) { return '<div class="flag ' + f.level + '">⚠ ' + esc(f.text) + '</div>'; }).join('');
  var hist = '<h2 style="font-size:15px;margin:10px 0 6px">History</h2><div id="hist" style="height:150px;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;border:1px solid var(--border);border-radius:12px;padding:4px 10px">' + histHtml(log) + '</div>';
  var inactive = !i.active ? '<div class="oos-banner na-banner"><div class="big">⏸ INACTIVE</div><div class="why">This sticker is not in use' + (isAdmin() ? ' — turn it back on in Admin → Active stickers' : '') + '</div></div>' : '';

  return '<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px"><span style="font-size:30px;line-height:1">' + itemIcon(i) + '</span>' +
    '<div style="flex:1"><h3>' + esc(i.name) + '</h3><div class="hint" style="margin:0">' + esc(i.type) + kindTag(i) + '</div></div>' +
    '<button class="btn ghost sm" onclick="closeModal()">✕</button></div>' + inactive + banner + flags + hist +
    (i.active ? '<div class="row" style="margin:12px 0">' +
      (!canAct(i) && !isNA(i) ? '<div class="o2calc" style="width:100%;text-align:center;margin:0">📷 To sign this ' + (out ? 'in' : onv ? 'off the vehicle' : 'out') + ', <b>scan its QR sticker</b> or type its ID (#' + esc(i.id) + ') on the Scan screen.</div>'
      : out ? (canSignIn(i) ? '<button class="btn green" onclick="actionForm(\'' + esc(i.id) + '\',\'IN\')">✓ Sign IN</button>'
             : '<button class="btn ghost" disabled style="opacity:1;color:var(--text2);font-size:13px">🔒 Only ' + esc(holderName(i)) + ' or an admin can sign in</button>')
           : isNA(i) ? (isAdmin() ? '<button class="btn green" onclick="statusForm(\'' + esc(i.id) + '\',\'Available\')">✅ Fixed — mark available</button>' : '<div class="o2calc" style="width:100%;text-align:center;margin:0">⚠ Needs attention — an admin will mark it fixed.</div>')
           : onv ? '<button class="btn green" onclick="submitVehicle(\'' + esc(i.id) + '\',\'\')">🏠 Take off vehicle</button>'
           : '<button class="btn red" onclick="actionForm(\'' + esc(i.id) + '\',\'OUT\')">↗ Sign OUT</button>') +
      '</div>' +
      '<div class="row" style="margin-bottom:12px">' +
      ((i.status === 'Available' || onv) && vehicles().length && canAct(i) ? '<button class="btn ghost sm" onclick="vehicleForm(\'' + esc(i.id) + '\')">🚑 ' + (onv ? 'Move vehicle' : 'Put on vehicle') + '</button>' : '') +
      (!isNA(i) && i.status !== 'Not Available' ? '<button class="btn ghost sm" onclick="statusForm(\'' + esc(i.id) + '\',\'Out of Service\')">⚠ Needs attention</button>' : '') +
      (i.status === 'Not Available' ? '<button class="btn ghost sm" style="width:100%" onclick="statusForm(\'' + esc(i.id) + '\',\'Available\')">✅ Found — Available</button>' : '') +
      '</div>' : '') +
    '<div class="card" style="box-shadow:none;border:1px solid var(--border);margin-top:10px"><div class="kv">' + kv.map(function (p) { return '<div>' + p[0] + '</div><div>' + p[1] + '</div>'; }).join('') + '</div></div>';
}
function logRow(l) {

    '<div class="t">' + fmtTs(l.ts) + ' · ' + esc(l.member) + '</div>' + (l.by ? '<div class="t" style="color:var(--blue)">🛡 Entered by ' + esc(l.by) + '</div>' : '') +

function qrUrlFor(id) { return APP_URL + '?id=' + encodeURIComponent(id); }
function qrImg(text) { var q = qrcode(0, 'M'); q.addData(text); q.make(); return q.createDataURL(6, 2); }
var SHEET_DEF = { pw: 8.5, ph: 11, cols: 7, rows: 3, w: 1, h: 3, left: 0.375, top: 0.75, gx: 0.125, gy: 0.25 };
var SHEET_F = [['pw', 'Page width'], ['ph', 'Page height'], ['cols', 'Labels across'], ['rows', 'Labels down'], ['w', 'Label width'], ['h', 'Label height'], ['left', 'Left edge → 1st label'], ['top', 'Top edge → 1st label'], ['gx', 'Gap side-to-side'], ['gy', 'Gap top-to-bottom']];
function sheetCfg() { var c = {}; try { c = JSON.parse(store('tvac_sheet') || '{}') || {}; } catch (e) {} var o = {}; for (var k in SHEET_DEF) { var v = c[k], zeroOk = ['left', 'top', 'gx', 'gy'].indexOf(k) >= 0; o[k] = typeof v === 'number' && isFinite(v) && (v > 0 || (zeroOk && v === 0)) ? v : SHEET_DEF[k]; } o.cols = Math.round(o.cols); o.rows = Math.round(o.rows); return o; }
function sheetSave() { var o = {}; SHEET_F.forEach(function (f) { o[f[0]] = Number($('sh-' + f[0]).value); }); store('tvac_sheet', JSON.stringify(o)); stkMode(); }
function sheetReset() { store('tvac_sheet', null); SHEET_F.forEach(function (f) { $('sh-' + f[0]).value = SHEET_DEF[f[0]]; }); stkMode(); }
function stkMode() {
  var sheet = $('stk-sheet').checked, c = sheetCfg(), n = c.cols * c.rows;
  $('stk-sheetopts').classList.toggle('hidden', !sheet);
  $('stk-hint').innerHTML = sheet ? 'Prints on a full ' + c.pw + ' × ' + c.ph + ' in sheet of ' + n + ' labels (' + c.w + ' × ' + c.h + ' in). Print at <b>100% / Actual size</b>. Try <b>Test fit</b> on plain paper first.'
    : 'One 1 × 3 in label per page, for a label printer. Paper size 3 × 1 in, scale 100%.';
  $('stk-start').max = n; if (Number($('stk-start').value) > n) $('stk-start').value = n;
}
function stickerPicker(pre) {
  var act = S.items.filter(function (i) { return i.active; }), c = sheetCfg();
  pre = pre || [];
  var lp = store('tvac_stkfmt') === 'label';
  showModal('<h3>🖨 QR stickers</h3>' +
    '<div class="row" style="margin:6px 0"><label class="ck" style="flex:1"><input type="radio" name="stkfmt" id="stk-sheet" onchange="store(\'tvac_stkfmt\',\'sheet\');stkMode()"' + (lp ? '' : ' checked') + '> 📄 Sticker sheet</label>' +
    '<label class="ck" style="flex:1"><input type="radio" name="stkfmt" id="stk-label" onchange="store(\'tvac_stkfmt\',\'label\');stkMode()"' + (lp ? ' checked' : '') + '> 🏷 Label printer</label></div>' +
    '<div class="hint" id="stk-hint"></div>' +
    '<div id="stk-sheetopts"><div class="row" style="align-items:flex-end;margin-top:8px"><div style="flex:1"><label>Start at label #</label><input id="stk-start" type="number" min="1" value="1" inputmode="numeric"></div>' +
    '<button class="btn ghost" style="flex:1" onclick="stickerPdf([], {sheet:true, test:true})">📐 Test fit</button></div>' +
    '<div class="hint" style="margin-top:4px">Label 1 is top-left, counting across. Use this to finish a partly used sheet.</div>' +
    '<details style="margin-top:8px"><summary style="font-weight:700;cursor:pointer">⚙ Adjust sheet layout (inches)</summary><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;margin-top:6px">' +
    SHEET_F.map(function (f) { return '<div><label style="font-size:12px">' + f[1] + '</label><input id="sh-' + f[0] + '" type="number" step="0.01" inputmode="decimal" value="' + c[f[0]] + '" onchange="sheetSave()"></div>'; }).join('') +

    '<div class="row" style="margin-top:10px"><button class="btn ghost sm" style="width:100%" onclick="stkAll(true)">☑ Select all</button><button class="btn ghost sm" style="width:100%" onclick="stkAll(false)">☐ Clear</button></div>' +
    '<div class="checks" style="margin:6px 0 10px">' + TYPES.map(function (t) {

        l.map(function (i) { return '<label class="ck"><input type="checkbox" data-stk="' + esc(i.id) + '" data-type="' + esc(t) + '" onchange="stkCount()"' + (pre.indexOf(i.id) >= 0 ? ' checked' : '') + '> ' + esc(i.name) + ' <span class="hint">' + esc(i.id) + '</span></label>'; }).join('') : '';

function stkGo(dl) {
  var ids = [].map.call(document.querySelectorAll('[data-stk]:checked'), function (c) { return c.dataset.stk; });
  if (!ids.length) { toast('Select at least one item'); return; }
  var sheet = $('stk-sheet').checked;
  if (sheet || dl) stickerPdf(ids, { sheet: sheet, start: Math.max(1, Number($('stk-start').value) || 1), download: dl });
  else printStickers(ids);

function stkAll(on, type) {

function stkCount() { var n = document.querySelectorAll('[data-stk]:checked').length; $('stk-go').textContent = 'Print (' + n + ')'; }

  }).join('');
  var mobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) || navigator.standalone || matchMedia('(display-mode: standalone)').matches;
  if (!mobile) { setTimeout(function () { window.print(); }, 300); return; }

// Phones can't print from a web app reliably → build a 3×1 in PDF and hand it to the share sheet / PDF viewer
function loadScript(src) { return new Promise(function (ok, bad) { var s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = function () { bad(new Error('Could not load PDF tool — check your connection')); }; document.head.appendChild(s); }); }
function loadImg(src) { return new Promise(function (ok) { var im = new Image(); im.onload = function () { ok(im); }; im.onerror = function () { ok(null); }; im.src = src; }); }
function stickerCanvas(it, logo) {
  var D = 300, c = document.createElement('canvas'); c.width = 3 * D; c.height = D; var x = c.getContext('2d');
  x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height);
  var q = qrcode(0, 'M'); q.addData(qrUrlFor(it.id)); q.make();
  var n = q.getModuleCount(), qs = .9 * D, m = qs / (n + 4), ox = .08 * D, oy = (D - qs) / 2;
  x.fillStyle = '#000';
  for (var r = 0; r < n; r++) for (var k = 0; k < n; k++) if (q.isDark(r, k)) x.fillRect(Math.floor(ox + (k + 2) * m), Math.floor(oy + (r + 2) * m), Math.ceil(m), Math.ceil(m));
  var tx = ox + qs + .08 * D, tw = c.width - tx - .08 * D, y = .2 * D;
  if (logo) x.drawImage(logo, tx, y - .17 * D, .2 * D, .2 * D);
  x.fillStyle = '#1b2a6b'; x.font = '800 ' + (7.5 / 72 * D) + 'px Helvetica,Arial,sans-serif'; x.textBaseline = 'alphabetic';
  x.fillText('TVAC EQUIPMENT', tx + (logo ? .24 * D : 0), y);
  x.fillStyle = '#c8102e'; x.fillRect(tx, y + .03 * D, tw, 1.5 / 72 * D);
  var nm = it.name || it.id, fs = 11 / 72 * D; x.fillStyle = '#000'; x.font = '800 ' + fs + 'px Helvetica,Arial,sans-serif';
  while (x.measureText(nm).width > tw && nm.length > 3) nm = nm.slice(0, -2) + '…';
  x.fillText(nm, tx, y + .23 * D);
  x.fillStyle = '#c8102e'; x.font = '800 ' + (10 / 72 * D) + 'px Helvetica,Arial,sans-serif'; x.fillText(it.id, tx, y + .41 * D);
  var kd = kindOf(it);
  x.fillStyle = '#333'; x.font = (5.5 / 72 * D) + 'px Helvetica,Arial,sans-serif'; x.fillText((kd ? kd.name.toUpperCase() + ' BAG · ' : '') + 'Scan to sign out · sign in', tx, y + .55 * D);

function saveBlob(blob, name) { var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(function () { a.remove(); }, 1000); return a.href; }
function stickerZip(ids) {
  var b = $('zip-btn'); if (b) { b.disabled = true; b.textContent = 'Making images…'; }
  Promise.all([ids.length > 1 && !window.JSZip ? loadScript('https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js') : 0, loadImg('logo.png')]).then(function (r) {
    var toBlob = function (cv) { return new Promise(function (ok) { cv.toBlob(ok, 'image/png'); }); };
    var cvs = ids.map(function (id) { return stickerCanvas(getItem(id) || { id: id, name: id }, r[1]); });
    if (ids.length === 1) return toBlob(cvs[0]).then(function (bl) { return [bl, 'TVAC-sticker-' + ids[0] + '.png']; });
    var z = new JSZip();
    return Promise.all(cvs.map(toBlob)).then(function (bls) { bls.forEach(function (bl, k) { z.file(ids[k] + '.png', bl); }); return z.generateAsync({ type: 'blob' }); })
      .then(function (bl) { return [bl, 'TVAC-stickers.zip']; });
  }).then(function (res) {
    var href = saveBlob(res[0], res[1]);
    if (b) { var a = document.createElement('a'); a.className = 'btn ghost'; a.style.cssText = 'display:block;text-align:center;text-decoration:none;margin-bottom:8px'; a.href = href; a.download = res[1]; a.textContent = '🖼 Save ' + res[1]; b.replaceWith(a); }
  }).catch(function (e) { toast('⚠ ' + e.message, 5000); if (b) { b.disabled = false; b.textContent = '🖼 Try images again'; } });
}
function rotateCanvas(src) { // portrait label: turn the 3×1 design on its side (reads bottom-to-top)
  var c = document.createElement('canvas'); c.width = src.height; c.height = src.width; var x = c.getContext('2d');
  x.translate(0, c.height); x.rotate(-Math.PI / 2); x.drawImage(src, 0, 0); return c;
}
function stickerPdf(ids, o) {
  o = o || {};
  showModal('<h3>🖨 QR stickers</h3><div class="spinner"></div><div class="hint" style="text-align:center">Making PDF…</div>');
  Promise.all([window.jspdf ? 0 : loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js'), loadImg('logo.png')]).then(function (r) {
    var logo = r[1], doc, pages = 1, name;
    var img = function (id) { var cv = stickerCanvas(getItem(id) || { id: id, name: id }, logo); return cv; };
    if (o.sheet) {
      var c = sheetCfg(), per = c.cols * c.rows, slot = (o.start || 1) - 1, portrait = c.h > c.w;
      doc = new window.jspdf.jsPDF({ orientation: c.pw > c.ph ? 'landscape' : 'portrait', unit: 'in', format: [c.pw, c.ph] });
      var pos = function (k) { var col = k % c.cols, row = Math.floor(k / c.cols); return [c.left + col * (c.w + c.gx), c.top + row * (c.h + c.gy)]; };
      if (o.test) {

        for (var k = 0; k < per; k++) { var p = pos(k); doc.rect(p[0], p[1], c.w, c.h); doc.text(String(k + 1), p[0] + c.w / 2, p[1] + c.h / 2, { align: 'center' }); }
        doc.setTextColor(0); doc.setFontSize(10); doc.text('TEST FIT — print at 100% on plain paper, hold it over a sticker sheet up to the light.', c.pw / 2, Math.max(0.3, c.top / 2), { align: 'center' });
        name = 'TVAC-sheet-test.pdf';
      } else {
        ids.forEach(function (id) {
          if (slot >= per) { doc.addPage([c.pw, c.ph], c.pw > c.ph ? 'landscape' : 'portrait'); slot = 0; pages++; }
          var cv = img(id); if (portrait) cv = rotateCanvas(cv);
          var p = pos(slot++); doc.addImage(cv.toDataURL('image/png'), 'PNG', p[0], p[1], c.w, c.h);
        });
        name = 'TVAC-sticker-sheet.pdf';
      }
    } else {
      doc = new window.jspdf.jsPDF({ orientation: 'landscape', unit: 'in', format: [1, 3] });
      ids.forEach(function (id, n) { if (n) doc.addPage([1, 3], 'landscape'); doc.addImage(img(id).toDataURL('image/png'), 'PNG', 0, 0, 3, 1); });
      name = 'TVAC-stickers' + (ids.length === 1 ? '-' + ids[0] : '') + '.pdf';
    }
    var blob = doc.output('blob');
    var file = new File([blob], name, { type: 'application/pdf' }), url = URL.createObjectURL(blob);
    window._stkFile = file;
    var canShare = navigator.canShare && navigator.canShare({ files: [file] });
    window._stkIds = ids;
    var dlBtns = '<a class="btn" style="display:block;text-align:center;text-decoration:none;margin-bottom:8px" href="' + url + '" download="' + name + '">⬇ Download PDF</a>' +
      (ids.length ? '<button class="btn ghost" style="margin-bottom:8px" id="zip-btn" onclick="stickerZip(window._stkIds)">🖼 Download as images' + (ids.length > 1 ? ' (.zip)' : ' (.png)') + '</button>' : '');
    if (o.download) {
      showModal('<h3>⬇ ' + ids.length + ' sticker' + (ids.length > 1 ? 's' : '') + ' ready</h3><div class="hint" style="margin-bottom:12px">' + (o.sheet ? 'PDF is laid out on the sticker sheet.' : 'PDF has one 3 × 1 in sticker per page.') + ' Images are one PNG per sticker (3 × 1 in at 300 dpi).</div>' + dlBtns +
        (canShare ? '<button class="btn ghost" style="margin-bottom:8px" onclick="navigator.share({files:[window._stkFile]}).catch(function(){})">📤 Share / Save to Files</button>' : '') +
        '<button class="btn ghost" onclick="stickerPicker()">Back</button>');
      return;
    }
    var title = o.test ? '📐 Test sheet ready' : '🖨 ' + ids.length + ' sticker' + (ids.length > 1 ? 's' : '') + ' ready' + (o.sheet ? ' (' + pages + ' sheet' + (pages > 1 ? 's' : '') + ')' : '');
    showModal('<h3>' + title + '</h3><div class="hint" style="margin-bottom:12px">' +
      (canShare ? 'Tap <b>Share / Print</b>, then choose <b>Print</b>. ' : 'Open the PDF, then print it. ') +
      (o.sheet ? 'Set scale to <b>100% / Actual size</b> (not "Fit to page").' : 'Paper size 3 × 1 in, scale 100%.') + '</div>' +
      (canShare ? '<button class="btn" style="margin-bottom:8px" onclick="navigator.share({files:[window._stkFile]}).catch(function(){})">📤 Share / Print</button>' : '') +
      '<a class="btn ' + (canShare ? 'ghost' : '') + '" style="display:block;text-align:center;text-decoration:none;margin-bottom:8px" href="' + url + '" download="' + name + '" target="_blank">📄 Open PDF</a>' +
      '<button class="btn ghost" onclick="stickerPicker()">Back</button>');
  }).catch(function (e) { closeModal(); toast('⚠ ' + e.message, 5000); });
}

// ════════ SCANNER ════════
var _stream = null, _raf = null, _cam = null, _camOff = null; // _cam = kept-alive camera so the phone doesn't ask again each scan
function openScanner() {
  var el = document.createElement('div'); el.id = 'scanner';
  el.innerHTML = '<video playsinline muted></video><div class="frame"></div><div class="bar"><div style="color:#fff;text-align:center;margin-bottom:10px;font-weight:600">Point at an equipment QR sticker</div>' +
    '<div class="row"><input id="manual-id" placeholder="Or type ID (e.g. 1001)" inputmode="numeric" style="text-transform:uppercase"><button class="btn sm" onclick="scanned($(\'manual-id\').value)">Go</button></div>' +
    '<button class="btn ghost" style="margin-top:10px" onclick="closeScanner()">Cancel</button></div>';
  document.body.appendChild(el);
  var video = el.querySelector('video');
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { toast('Camera not available — type the ID'); return; }
  clearTimeout(_camOff);
  var live = _cam && _cam.getVideoTracks().some(function (t) { return t.readyState === 'live'; });
  (live ? Promise.resolve(_cam) : navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })).then(function (s) {
    _cam = s; s.getTracks().forEach(function (t) { t.enabled = true; });
    _stream = s; video.srcObject = s; video.play(); tick(video);
  }).catch(function () { toast('Camera blocked — type the ID or use your phone camera app'); });
}
function tick(video) {
  var c = document.createElement('canvas'), ctx = c.getContext('2d', { willReadFrequently: true });
  (function loop() {
    if (!_stream) return;

      var w = video.videoWidth, h = video.videoHeight, sc = Math.min(1, 640 / w);

      var code = jsQR(ctx.getImageData(0, 0, c.width, c.height).data, c.width, c.height, { inversionAttempts: 'dontInvert' });
      if (code && code.data) { scanned(code.data); return; }

function closeScanner() {

function stopCam() { if (_cam) _cam.getTracks().forEach(function (t) { t.stop(); }); _cam = null; }
document.addEventListener('visibilitychange', function () { if (document.hidden && !_stream) stopCam(); });
function scanned(text) {

  S.scanId = id.toUpperCase(); // opened by scanning / typing the ID → members may sign it in or out
  openItem(id.toUpperCase());
}

// ════════ MODAL ════════
function showModal(html, cls) {
  var root = $('modal-root');
  root.innerHTML = '<div class="modal" onclick="if(event.target===this)closeModal()"><div class="sheet' + (cls ? ' ' + cls : '') + '">' + html + '</div></div>';
  document.body.style.overflow = 'hidden';
}
function closeModal() { if (S.updateReady) { location.reload(); return; } S.scanId = null; $('modal-root').innerHTML = ''; document.body.style.overflow = ''; if (location.search.indexOf('id=') >= 0) history.replaceState(null, '', APP_URL); }
function busy(on) { var b = $('f-go'); if (b) { b.disabled = on; if (on) { b.dataset.t = b.textContent; b.textContent = 'Saving…'; } else if (b.dataset.t) b.textContent = b.dataset.t; } }
function updateLocal(item) { var idx = S.items.findIndex(function (i) { return i.id === item.id; }); if (idx >= 0) S.items[idx] = item; else S.items.push(item); }

// ════════ BOOT ════════
(function () {
  var p = new URLSearchParams(location.search);
  S.pendingId = p.get('id');
  if (p.get('tab')) S.tab = p.get('tab');
  $('pin').addEventListener('keydown', function (e) { if (e.key === 'Enter') doLogin(); });
  if (/PASTE_APPS_SCRIPT/.test(API_URL)) { $('login').classList.remove('hidden'); $('login-sub').textContent = '⚠ Set API_URL in index.html'; return; }
  var pin = store('tvac_pin'), mem = store('tvac_member');
  if (pin && mem) { S.pin = pin; try { S.member = JSON.parse(mem); } catch (e) {} }
  if (S.pin && S.member) startApp();
  else {
    $('login').classList.remove('hidden');
    if (S.pendingId) $('login-sub').textContent = 'Enter your PIN to open ' + S.pendingId;
    setTimeout(function () { $('pin').focus(); }, 100);
  }
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
  // pick up changes made in the Google Sheet: every 60s, and whenever the app comes back to the foreground
  setInterval(function () { if (S.pin && (!document.hidden || notifOn())) refresh(); }, 60000); // keeps checking even with an item page open
  if (navigator.serviceWorker) navigator.serviceWorker.addEventListener('message', function (e) { if (e.data && e.data.type === 'open' && e.data.id && S.pin) openItem(e.data.id); });
  document.addEventListener('visibilitychange', function () { if (!document.hidden && S.pin) refresh(); if (!document.hidden) checkUpdate(); });
  setTimeout(checkUpdate, 5000); setInterval(checkUpdate, 5 * 60000);
})();
</script>
